<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMG Hub</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f6f8; --white: #ffffff; --black: #111111;
    --sky: #5bb8f5; --sky-light: #e8f5fe; --sky-mid: #b3ddfb; --sky-dark: #2a8fd4;
    --gray: #f0f1f3; --muted: #8a8f9a; --text: #1a1c20; --text2: #5a5f6b;
    --border: #e4e6ea; --green: #22c55e; --green-light: #dcfce7;
    --sans: "DM Sans", sans-serif; --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  }
  body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:0 24px; height:64px; background:var(--black); position:sticky; top:0; z-index:100; }
  .topbar-logo img { height:44px; width:auto; object-fit:contain; display:block; }
  .topbar-right { display:flex; align-items:center; gap:12px; flex-shrink:0; }
  .date-chip { font-size:12px; color:rgba(255,255,255,0.4); }
  .live-badge { display:flex; align-items:center; gap:5px; background:rgba(91,184,245,0.15); border:1px solid rgba(91,184,245,0.3); border-radius:20px; padding:4px 10px; font-size:11px; color:var(--sky); font-weight:600; white-space:nowrap; }
  .live-dot { width:6px; height:6px; border-radius:50%; background:var(--sky); animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .nav { display:flex; padding:0 16px; background:var(--white); border-bottom:1px solid var(--border); box-shadow:var(--shadow-sm); overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .nav::-webkit-scrollbar { display:none; }
  .nav-tab { font-family:var(--sans); font-size:13px; font-weight:500; padding:14px 18px; border:none; background:none; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; transition:all 0.15s; margin-bottom:-1px; white-space:nowrap; }
  .nav-tab:hover { color:var(--text); }
  .nav-tab.active { color:var(--sky-dark); border-bottom-color:var(--sky); }
  .main { padding:20px; }
  .section-head { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .section-head h2 { font-size:16px; font-weight:700; color:var(--text); }
  .count-badge { font-size:11px; font-weight:600; color:var(--sky-dark); background:var(--sky-light); padding:2px 8px; border-radius:20px; }
  .stats-row { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:24px; }
  .stat-card { background:var(--white); border:1px solid var(--border); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow-sm); }
  .stat-label { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.07em; color:var(--muted); margin-bottom:6px; }
  .stat-value { font-size:26px; font-weight:700; color:var(--text); line-height:1; }
  .stat-sub { font-size:11px; color:var(--muted); margin-top:4px; }
  .stat-card.accent { background:var(--black); }
  .stat-card.accent .stat-label { color:rgba(255,255,255,0.35); }
  .stat-card.accent .stat-value { color:var(--sky); }
  .stat-card.accent .stat-sub { color:rgba(255,255,255,0.25); }
  .client-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; margin-bottom:28px; }
  .client-card { background:var(--white); border:1px solid var(--border); border-radius:16px; overflow:hidden; cursor:pointer; transition:all 0.18s; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; }
  .client-card:hover { border-color:var(--sky-mid); box-shadow:0 4px 20px rgba(91,184,245,0.13); transform:translateY(-1px); }
  .card-logo-area { height:88px; display:flex; align-items:center; justify-content:center; padding:14px; border-bottom:1px solid var(--border); }
  .card-logo-area img { max-height:56px; max-width:100%; object-fit:contain; }
  .card-logo-placeholder { font-size:15px; font-weight:700; color:var(--text2); }
  .card-body { padding:12px 14px 14px; flex:1; display:flex; flex-direction:column; gap:8px; }
  .card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .client-name { font-size:13px; font-weight:700; color:var(--text); }
  .client-type { font-size:11px; color:var(--muted); margin-top:2px; }
  .freq-badge { font-size:10px; font-weight:600; padding:3px 8px; border-radius:20px; background:var(--gray); color:var(--text2); white-space:nowrap; flex-shrink:0; }
  .service-tags { display:flex; flex-wrap:wrap; gap:4px; }
  .tag { font-size:10px; font-weight:600; padding:3px 7px; border-radius:6px; }
  .tag.post { background:var(--sky-light); color:var(--sky-dark); }
  .tag.story { background:#eef4ff; color:#3a6fd8; }
  .tag.ambassador { background:#fff3ec; color:#c0622a; }
  .tag.like { background:#f3eeff; color:#7a4cc0; }
  .tag.film { background:#fffbec; color:#a07a10; }
  .tag.multiplatform { background:#ecfff4; color:#1e8a4a; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:200; display:none; align-items:center; justify-content:center; padding:20px; }
  .modal-overlay.open { display:flex; }
  .modal { background:var(--white); border-radius:20px; padding:24px; width:100%; max-width:520px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.2); }
  .modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .modal-title { font-size:17px; font-weight:700; }
  .modal-close { font-size:22px; background:none; border:none; cursor:pointer; color:var(--muted); padding:2px 6px; border-radius:6px; line-height:1; }
  .modal-close:hover { background:var(--gray); }
  .form-group { margin-bottom:14px; }
  .form-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.07em; color:var(--muted); display:block; margin-bottom:5px; }
  .form-input { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:var(--sans); font-size:13px; padding:9px 12px; outline:none; transition:border-color 0.15s; }
  .form-input:focus { border-color:var(--sky); }
  .checkbox-group { display:flex; flex-wrap:wrap; gap:8px; }
  .checkbox-item { display:flex; align-items:center; gap:6px; cursor:pointer; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:6px 10px; transition:all 0.12s; user-select:none; }
  .checkbox-item.checked { background:var(--sky-light); border-color:var(--sky-mid); }
  .checkbox-item input { display:none; }
  .checkbox-item span { font-size:12px; font-weight:500; color:var(--text2); }
  .checkbox-item.checked span { color:var(--sky-dark); }
  .modal-actions { display:flex; gap:8px; margin-top:20px; }
  .btn-save { background:var(--black); color:var(--white); font-family:var(--sans); font-size:13px; font-weight:700; padding:10px 20px; border:none; border-radius:10px; cursor:pointer; flex:1; transition:background 0.15s; }
  .btn-save:hover { background:var(--sky-dark); }
  .btn-cancel { background:var(--gray); color:var(--text2); font-family:var(--sans); font-size:13px; font-weight:600; padding:10px 20px; border:none; border-radius:10px; cursor:pointer; }
  .task-toolbar { display:flex; align-items:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
  .task-toolbar-left { display:flex; align-items:center; gap:8px; flex:1; flex-wrap:wrap; }
  .filter-btn { font-size:12px; font-weight:500; padding:6px 12px; border:1px solid var(--border); border-radius:8px; background:var(--white); color:var(--text2); cursor:pointer; transition:all 0.12s; white-space:nowrap; }
  .filter-btn.active { background:var(--sky-light); border-color:var(--sky-mid); color:var(--sky-dark); }
  .show-done-btn { font-size:12px; font-weight:500; padding:6px 12px; border:1px solid var(--border); border-radius:8px; background:var(--white); color:var(--muted); cursor:pointer; white-space:nowrap; }
  .show-done-btn.active { background:var(--green-light); border-color:#86efac; color:#15803d; }
  .add-task-btn { background:var(--black); color:var(--white); font-family:var(--sans); font-size:12px; font-weight:700; padding:7px 14px; border:none; border-radius:8px; cursor:pointer; white-space:nowrap; }
  .add-task-btn:hover { background:var(--sky-dark); }
  .task-table { background:var(--white); border:1px solid var(--border); border-radius:14px; overflow:hidden; box-shadow:var(--shadow-sm); margin-bottom:20px; }
  .task-table-header { display:grid; grid-template-columns:32px 1fr 130px 80px 100px 36px; align-items:center; padding:10px 14px; background:var(--gray); border-bottom:1px solid var(--border); gap:8px; }
  .task-table-header span { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.07em; color:var(--muted); }
  .task-row { display:grid; grid-template-columns:32px 1fr 130px 80px 100px 36px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--border); gap:8px; transition:background 0.1s; }
  .task-row:last-of-type { border-bottom:none; }
  .task-row:hover { background:#fafbfc; }
  .task-row.done { opacity:0.4; }
  .task-row.done .task-name-cell { text-decoration:line-through; color:var(--muted); }
  .task-check { width:18px; height:18px; border-radius:5px; border:2px solid var(--border); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:all 0.15s; background:var(--white); }
  .task-check:hover { border-color:var(--sky); }
  .task-check.checked { background:var(--green); border-color:var(--green); }
  .task-check.checked::after { content:"✓"; font-size:11px; color:#fff; font-weight:700; line-height:1; }
  .task-name-cell { font-size:13px; font-weight:500; color:var(--text); min-width:0; }
  .task-client-cell { font-size:11px; font-weight:600; color:var(--text2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .task-day-cell { font-size:12px; color:var(--text2); }
  .task-type-pill { font-size:10px; font-weight:600; padding:3px 8px; border-radius:6px; white-space:nowrap; display:inline-block; }
  .task-delete { font-size:18px; background:none; border:none; cursor:pointer; color:var(--muted); opacity:0; transition:opacity 0.12s; padding:0; border-radius:4px; width:28px; height:28px; display:flex; align-items:center; justify-content:center; }
  .task-row:hover .task-delete { opacity:1; }
  .task-delete:hover { color:#ef4444; background:#fff0f0; }
  .task-group-header { padding:8px 14px; background:var(--bg); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:8px; }
  .task-group-label { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); }
  .task-group-count { font-size:10px; font-weight:600; color:var(--sky-dark); background:var(--sky-light); padding:1px 7px; border-radius:10px; }
  .add-task-form { display:none; background:var(--sky-light); border-top:1px solid var(--sky-mid); padding:12px 14px; gap:8px; flex-wrap:wrap; align-items:center; }
  .add-task-form.open { display:flex; }
  .add-task-form input, .add-task-form select { background:var(--white); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:var(--sans); font-size:13px; padding:7px 10px; outline:none; }
  .add-task-form input:focus, .add-task-form select:focus { border-color:var(--sky); }
  .add-task-form input { flex:1; min-width:140px; }
  .btn-add-confirm { background:var(--sky); color:var(--white); font-family:var(--sans); font-size:12px; font-weight:700; padding:7px 14px; border:none; border-radius:8px; cursor:pointer; }
  .btn-add-cancel { background:none; border:1px solid var(--border); font-family:var(--sans); font-size:12px; padding:7px 12px; border-radius:8px; cursor:pointer; color:var(--muted); }
  .notes-area { background:var(--white); border:1px solid var(--border); border-radius:14px; padding:16px 18px; margin-bottom:12px; box-shadow:var(--shadow-sm); }
  .notes-area h3 { font-size:13px; font-weight:700; color:var(--text); margin-bottom:8px; }
  .notes-area textarea { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:var(--sans); font-size:13px; line-height:1.6; padding:10px 12px; resize:vertical; min-height:68px; outline:none; }
  .notes-area textarea:focus { border-color:var(--sky); }
  .today-task-row { display:flex; align-items:center; gap:10px; background:var(--white); border:1px solid var(--border); border-radius:10px; padding:10px 14px; margin-bottom:6px; box-shadow:var(--shadow-sm); }
  .today-task-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .today-task-name { font-size:13px; font-weight:500; color:var(--text); flex:1; }
  .today-task-client { font-size:11px; color:var(--muted); background:var(--gray); padding:2px 8px; border-radius:6px; white-space:nowrap; }
  .tab-view { display:none; }
  .tab-view.active { display:block; }
  .empty-msg { font-size:12px; color:var(--muted); text-align:center; padding:24px; font-style:italic; }
  .btn-sky { background:var(--sky); color:var(--white); font-family:var(--sans); font-size:13px; font-weight:600; padding:10px 20px; border:none; border-radius:10px; cursor:pointer; margin-top:8px; }
  @media (min-width:640px) { .stats-row { grid-template-columns:repeat(4,1fr); } .main { padding:28px; } }
  @media (max-width:580px) {
    .task-table-header { grid-template-columns:32px 1fr 90px 36px; }
    .task-row { grid-template-columns:32px 1fr 90px 36px; }
    .hide-mobile { display:none !important; }
  }
</style>
</head>

function getToday() { const d=new Date().getDay(); return d===0?6:d-1; }

function getTagLabels(c) {
  return c.services.map(s=>{const o=SERVICE_OPTIONS.find(x=>x.val===s);return o?o.label:s;});
}

function renderClientCard(c, container, showEdit) {
  const card = document.createElement("div");
  card.className = "client-card";
  const logoHTML = c.logoKey && LOGOS[c.logoKey]
    ? `<img src="${LOGOS[c.logoKey]}" alt="${c.name}">`
    : `<div class="card-logo-placeholder">${c.name}</div>`;
  const tagLabels = getTagLabels(c);
  const tagsHTML = c.services.map((t,i)=>`<span class="tag ${t}">${tagLabels[i]}</span>`).join("");
  card.innerHTML = `
    <div class="card-logo-area" style="background:${c.logoBg}">${logoHTML}</div>
    <div class="card-body">
      <div class="card-top">
        <div><div class="client-name">${c.name}</div><div class="client-type">${c.type}</div></div>
        <div class="freq-badge">${c.freq}</div>
      </div>
      <div class="service-tags">${tagsHTML}</div>
      ${showEdit?`<button onclick="event.stopPropagation();openEditModal('${c.id}')" style="margin-top:6px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:5px 12px;font-family:var(--sans);font-size:11px;font-weight:600;color:var(--text2);cursor:pointer;width:100%;transition:background 0.12s;" onmouseover="this.style.background='var(--sky-light)'" onmouseout="this.style.background='var(--bg)'">✏️ Edit client</button>`:''}
    </div>`;
  container.appendChild(card);
}

function renderClients() {
  ["client-grid-overview","client-grid-main"].forEach(id=>{
    const g=document.getElementById(id); g.innerHTML="";
    clients.forEach(c=>renderClientCard(c,g,id==="client-grid-main"));
  });
}

function openEditModal(id) {
  const c=clients.find(x=>x.id===id); if(!c) return;
  const modal=document.getElementById("modal-content");
  const serviceChecks=SERVICE_OPTIONS.map(o=>`<label class="checkbox-item ${c.services.includes(o.val)?'checked':''}" id="chk-${o.val}"><input type="checkbox" value="${o.val}" ${c.services.includes(o.val)?'checked':''} onchange="toggleCheck(this)"><span>${o.label}</span></label>`).join("");
  modal.innerHTML=`
    <div class="modal-header"><div class="modal-title">Edit — ${c.name}</div><button class="modal-close" onclick="document.getElementById('modal-overlay').classList.remove('open')">×</button></div>
    <div class="form-group"><label class="form-label">Client type</label><input class="form-input" id="edit-type" value="${c.type}"></div>
    <div class="form-group"><label class="form-label">Posting frequency</label><input class="form-input" id="edit-freq" value="${c.freq}"></div>
    <div class="form-group"><label class="form-label">Posts per week</label><input class="form-input" id="edit-ppw" type="number" min="0" max="20" value="${c.postsPerWeek||0}"></div>
    <div class="form-group"><label class="form-label">Services</label><div class="checkbox-group">${serviceChecks}</div></div>
    <div class="form-group"><label class="form-label">Platforms</label><input class="form-input" id="edit-platforms" value="${c.platforms.join(', ')}"></div>
    <div class="form-group"><label class="form-label">Notes</label><textarea class="form-input" id="edit-notes" rows="3" style="resize:vertical">${c.notes}</textarea></div>
    <div class="modal-actions"><button class="btn-cancel" onclick="document.getElementById('modal-overlay').classList.remove('open')">Cancel</button><button class="btn-save" onclick="saveClient('${c.id}')">Save changes</button></div>`;
  document.getElementById("modal-overlay").classList.add("open");
}

function toggleCheck(input) { input.closest('.checkbox-item').classList.toggle('checked',input.checked); }
function closeModal(e) { if(e.target===document.getElementById("modal-overlay")) document.getElementById("modal-overlay").classList.remove("open"); }

function saveClient(id) {
  const c=clients.find(x=>x.id===id); if(!c) return;
  c.type=document.getElementById("edit-type").value;
  c.freq=document.getElementById("edit-freq").value;
  c.postsPerWeek=parseInt(document.getElementById("edit-ppw").value)||0;
  c.notes=document.getElementById("edit-notes").value;
  c.platforms=document.getElementById("edit-platforms").value.split(',').map(s=>s.trim()).filter(Boolean);
  c.services=Array.from(document.querySelectorAll('.checkbox-item input:checked')).map(i=>i.value);
  document.getElementById("modal-overlay").classList.remove("open");
  renderClients(); renderTaskBoard(); updateStats();
}

function setFilter(type,btn) {
  activeFilter=type;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTaskBoard();
}

function toggleShowDone() {
  showDone=!showDone;
  document.getElementById('show-done-btn').classList.toggle('active',showDone);
  renderTaskBoard();
}

function toggleAddForm() {
  const form=document.getElementById('inline-add-form');
  if(form) form.classList.toggle('open');
}

function renderTaskBoard() {
  const board=document.getElementById('task-board'); board.innerHTML='';
  let filtered=tasks.filter(t=>activeFilter==='all'||t.type===activeFilter);
  if(!showDone) filtered=filtered.filter(t=>!t.done);
  const today=getToday();
  const table=document.createElement('div'); table.className='task-table';
  const header=document.createElement('div'); header.className='task-table-header';
  header.innerHTML='<span></span><span>Task</span><span>Client</span><span class="hide-mobile">Day</span><span class="hide-mobile">Type</span><span></span>';
  table.appendChild(header);
  let anyTask=false;
  DAYS_ORDERED.forEach((day,i)=>{
    const dayTasks=filtered.filter(t=>t.day===i);
    if(!dayTasks.length) return;
    anyTask=true;
    const gh=document.createElement('div'); gh.className='task-group-header';
    const isToday=i===today;
    gh.innerHTML=`<span class="task-group-label" style="${isToday?'color:var(--sky-dark)':''}">${day}${isToday?' — Today':''}</span><span class="task-group-count">${dayTasks.length}</span>`;
    table.appendChild(gh);
    dayTasks.forEach(t=>{
      const row=document.createElement('div'); row.className='task-row'+(t.done?' done':'');
      const tagClass=t.type||'post';
      row.innerHTML=`
        <div class="task-check ${t.done?'checked':''}" onclick="toggleTask(${t.id})"></div>
        <div class="task-name-cell">${t.text}</div>
        <div class="task-client-cell">${t.client||'—'}</div>
        <div class="task-day-cell hide-mobile">${DAYS_ORDERED[t.day]}</div>
        <div class="hide-mobile"><span class="task-type-pill tag ${tagClass}">${t.type}</span></div>
        <button class="task-delete" onclick="deleteTask(${t.id})">×</button>`;
      table.appendChild(row);
    });
  });
  if(!anyTask){
    const empty=document.createElement('div'); empty.className='empty-msg';
    empty.textContent=showDone?'No tasks found.':'All done! 🎉 Toggle "Show done" to review completed tasks.';
    table.appendChild(empty);
  }
  const form=document.createElement('div'); form.className='add-task-form'; form.id='inline-add-form';
  form.innerHTML=`
    <input type="text" id="new-task-text" placeholder="Task name...">
    <select id="new-task-client"><option value="">Client</option>${clients.map(c=>`<option>${c.name}</option>`).join('')}<option>Side job</option></select>
    <select id="new-task-day">${DAYS_ORDERED.map((d,i)=>`<option value="${i}"${i===today?' selected':''}>${d}</option>`).join('')}</select>
    <select id="new-task-type"><option value="post">Post</option><option value="story">Story</option><option value="ambassador">Ambassador</option><option value="film">Film/Edit</option><option value="like">Like tagged</option></select>
    <button class="btn-add-confirm" onclick="confirmAddTask()">Add</button>
    <button class="btn-add-cancel" onclick="toggleAddForm()">Cancel</button>`;
  table.appendChild(form);
  board.appendChild(table);
  updateStats();
}

function toggleTask(id) {
  const t=tasks.find(x=>x.id===id); if(!t) return;
  t.done=!t.done; renderTaskBoard(); renderTodayOverview(); updateStats();
}

function deleteTask(id) {
  tasks=tasks.filter(x=>x.id!==id); renderTaskBoard(); renderTodayOverview(); updateStats();
}

function confirmAddTask() {
  const text=document.getElementById('new-task-text').value.trim();
  const client=document.getElementById('new-task-client').value;
  const day=parseInt(document.getElementById('new-task-day').value);
  const type=document.getElementById('new-task-type').value;
  if(!text) return;
  tasks.push({id:nextId++,text,client,day,type,done:false});
  document.getElementById('new-task-text').value='';
  renderTaskBoard(); renderTodayOverview(); updateStats();
}

function renderTodayOverview() {
  const today=getToday();
  const el=document.getElementById('today-tasks-overview'); el.innerHTML='';
  const tt=tasks.filter(t=>t.day===today&&!t.done);
  if(!tt.length){el.innerHTML='<div class="empty-msg">All tasks done for today! 🎉</div>';return;}
  tt.forEach(t=>{
    const row=document.createElement('div'); row.className='today-task-row';
    row.innerHTML=`<div class="today-task-dot" style="background:${TYPE_COLORS[t.type]||'#5bb8f5'}"></div><div class="today-task-name">${t.text}</div><div class="today-task-client">${t.client}</div>`;
    el.appendChild(row);
  });
}

function updateStats() {
  const el=document.getElementById('stat-remaining');
  if(el) el.textContent=tasks.filter(t=>!t.done).length;
}

function switchTab(name) {
  document.querySelectorAll('.tab-view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  ['overview','clients','tasks','notes'].forEach((t,i)=>{if(t===name)document.querySelectorAll('.nav-tab')[i].classList.add('active');});
  if(name==='tasks') renderTaskBoard();
}

document.getElementById('live-date').textContent=new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
renderClients();
renderTodayOverview();
updateStats();
</script>
</body>
</html>
